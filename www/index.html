<!-- Portada con fondo tipo GIF de sangre sobre toda la pantalla -->
<div id="opening" class="opening-halloween brutal" role="status" aria-label="Cargando Digital Knight">
    <div class="blood-gif-bg" aria-hidden="true"></div>
    <div class="halloween-content">
        <span class="halloween-kicker">Especial de octubre</span>
        <img id="logo-opening" src="new-logo-2026.png" alt="Digital Knight">
        <p class="halloween-message">La noche acaba de comenzar</p>
        <div id="loader-opening" aria-label="Cargando"></div>
    </div>
</div>


<script type="module">

import { supabase } from './js/supabaseClient.js';

window.addEventListener('load', async () => {

    // Duración original del splash: setTimeout(resolve, 4500)
    // Halloween: dejamos la ambientación visible un poco más.
    await new Promise(resolve =>
        setTimeout(resolve, 8500)
    );

    const {
        data:{session}
    } = await supabase.auth.getSession();

    if(session){

        window.location.replace("main.html");

    }else{

        window.location.replace("login.html");

    }

});

</script>
