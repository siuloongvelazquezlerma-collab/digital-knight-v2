<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script disable-devtool-auto src="https://cdn.jsdelivr.net/npm/disable-devtool@latest"></script>
<title>Administrar Premium · Digital Knight</title>
<meta name="theme-color" content="#01011d">
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
    body{background:#01011d;color:#eef1ff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:20px;max-width:480px;width:100%;padding:32px 26px;backdrop-filter:blur(8px)}
    .logo{font-size:22px;font-weight:800;letter-spacing:.5px;margin-bottom:4px}
    .logo span{color:#6f95ff}
    .subtitle{color:#9aa3c7;font-size:13px;margin-bottom:26px}
    .state{border-radius:14px;padding:18px;margin-bottom:18px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
    .state.premium-on{border-color:rgba(0,125,255,.45);background:rgba(0,125,255,.07)}
    .state h2{font-size:18px;margin-bottom:10px}
    .row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
    .row:last-child{border-bottom:none}
    .row .k{color:#9aa3c7;white-space:nowrap}
    .row .v{font-weight:600;text-align:right;flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word}
    .badge{display:inline-block;background:linear-gradient(135deg,#007dff,#4358ff);color:#fff;font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 10px;border-radius:20px;margin-left:8px;vertical-align:middle}
    .btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px;transition:.2s}
    .btn-back{background:linear-gradient(135deg,#007dff,#4358ff);color:#fff;box-shadow:0 12px 32px rgba(0,120,255,.35)}
    .btn-back:hover{filter:brightness(1.12)}
    .btn-cancel{background:transparent;color:#ff6b7a;border:1px solid rgba(255,70,85,.5)}
    .btn-cancel:hover{background:rgba(255,70,85,.12)}
    .msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px;color:#9aa3c7}
    .msg.ok{color:#5dd97c}
    .msg.err{color:#ff6b7a}
    .note{font-size:12px;color:#8a92b8;margin-top:16px;line-height:1.5}
</style>
</head>
<body>

<div class="card">
    <div class="logo">DIGITAL <span>KNIGHT</span></div>
    <div class="subtitle">Administrar tu suscripción Premium</div>

    <div class="state" id="stateBox">
        <h2 id="stateTitle">Cargando…</h2>
        <div class="row"><span class="k">Estado</span><span class="v" id="stateValue">—</span></div>
        <div class="row"><span class="k">Vence / Venció</span><span class="v" id="untilValue">—</span></div>
        <div class="row"><span class="k">Dispositivos</span><span class="v" id="devicesValue">—</span></div>
        <div class="row"><span class="k">Cuenta</span><span class="v" id="emailValue">—</span></div>
    </div>

    <button class="btn btn-back" id="backBtn">Ir a la aplicación</button>
    <button class="btn btn-cancel" id="cancelBtn" style="display:none;">Cancelar suscripción Premium</button>

    <div class="msg" id="msg"></div>

    <p class="note" id="cancelNote" style="display:none;">
        Al cancelar, Digital Knight deja de cobrarte el próximo mes y pierdes
        los beneficios Premium de inmediato. Podrás reactivarlo cuando quieras.
    </p>
</div>

<script type="module" src="manage-premium.js"></script>
</body>
</html>
