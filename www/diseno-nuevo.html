<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Knight - Películas</title>
  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      background-color: #01011d;
      font-family: 'Roboto', sans-serif;
      color: white;
      max-width: 100vw;
      overflow-x: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: linear-gradient(90deg, #0a0a2a, #1a1a3d);
    }
    header .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #7f5af0;
    }
    header .perfil {
      font-size: 1rem;
      color: #fff;
      cursor: pointer;
    }
    /* Swiper principal */
    .swiper {
      width: 100%;
      height: 300px;
    }
    .swiper-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }
    /* Carruseles */
    .section {
      margin: 20px;
    }
    .section h2 {
      margin-bottom: 10px;
      color: #7f5af0;
    }
    .carousel {
      display: flex;
      overflow-x: auto;
      gap: 10px;
    }
    .carousel img {
      height: 180px;
      border-radius: 6px;
      transition: transform 0.3s;
    }
    .carousel img:hover {
      transform: scale(1.05);
    }
    /* Vertical Top 10 */
    .vertical-carousel {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
    .vertical-carousel img {
      width: 100%;
      border-radius: 6px;
    }
    /* Middle destacado */
    .middle {
      text-align: center;
      margin: 40px 20px;
    }
    .middle img {
      width: 80%;
      border-radius: 10px;
    }
    .middle button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #7f5af0;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    .middle button:hover {
      background: #5a3dcf;
    }
    /* Footer */
    footer {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 15px;
      background: #0a0a2a;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
    footer a {
      color: #7f5af0;
      text-decoration: none;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Digital Knight</div>
    <div class="perfil">Perfil</div>
  </header>

  <!-- Swiper -->
  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="poster1.jpg" alt="Poster 1"></div>
      <div class="swiper-slide"><img src="poster2.jpg" alt="Poster 2"></div>
      <div class="swiper-slide"><img src="poster3.jpg" alt="Poster 3"></div>
      <div class="swiper-slide"><img src="poster4.jpg" alt="Poster 4"></div>
      <div class="swiper-slide"><img src="poster5.jpg" alt="Poster 5"></div>
      <div class="swiper-slide"><img src="poster6.jpg" alt="Poster 6"></div>
    </div>
  </div>

  <!-- Secciones -->
  <div class="section">
    <h2>Populares</h2>
    <div class="carousel">
      <img src="pop1.jpg" alt="Popular 1">
      <img src="pop2.jpg" alt="Popular 2">
      <img src="pop3.jpg" alt="Popular 3">
      <img src="pop4.jpg" alt="Popular 4">
    </div>
  </div>

  <div class="section">
    <h2>Top 10</h2>
    <div class="vertical-carousel">
      <img src="top1.jpg" alt="Top 1">
      <img src="top2.jpg" alt="Top 2">
      <img src="top3.jpg" alt="Top 3">
      <img src="top4.jpg" alt="Top 4">
    </div>
  </div>

  <div class="middle">
    <img src="featured.jpg" alt="Película destacada">
    <button>Ver ahora</button>
  </div>

  <footer>
    <a href="#">Inicio</a>
    <a href="#">Buscar</a>
    <a href="#">Favoritos</a>
    <a href="#">Configuración</a>
  </footer>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    var swiper = new Swiper(".mySwiper", {
      autoplay: {
        delay: 5000,
        disableOnInteraction: false,
      },
      loop: true,
    });
  </script>
</body>
</html>
