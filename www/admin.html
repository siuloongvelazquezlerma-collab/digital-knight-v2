<body>

  <div class="card">

   <div id="preview" style="display:none;">

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://wplyrhcszuoordgaphax.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndwbHlyaGNzenVvb3JkZ2FwaGF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYyNDg5NzAsImV4cCI6MjA4MTgyNDk3MH0.VctFmTaBMHkhbqDhezAvFoAT_QcC-bk7A3gH1MoMScU"
    );

    // ==========================
// Cargar catálogo
// ==========================

let movies = [];

async function loadMovies() {

  try {

    const res = await fetch("movies.json");

    movies = await res.json();

    console.log("✅ Catálogo cargado:", movies.length);

  } catch (e) {

    console.error("No se pudo cargar movies.json", e);

  }

}

loadMovies();



// ==========================
// Buscador
// ==========================

const search = document.getElementById("search");
const searchResults = document.getElementById("searchResults");

search.addEventListener("input", () => {

    const text = search.value.trim().toLowerCase();

    if (text.length < 2) {
        searchResults.style.display = "none";
        searchResults.innerHTML = "";
        return;
    }

    const results = movies.filter(movie => {

        if (movie.title &&
            movie.title.toLowerCase().includes(text))
            return true;

        if (movie.hiddenTitles) {

            return movie.hiddenTitles.some(t =>
                t.toLowerCase().includes(text)
            );

        }

        return false;

    }).slice(0,8);

    showResults(results);

});

function showResults(results){

    if(results.length===0){

        searchResults.style.display="none";
        searchResults.innerHTML="";

        return;
    }

    searchResults.style.display="block";

    searchResults.innerHTML = results.map(movie=>`

<div class="search-item"
     onclick='selectMovie(${JSON.stringify(movie.title)})'>

    <img src="${movie.poster}">

    <div class="search-info">

        <div class="search-title">
            ${movie.title}
        </div>

        <div class="search-details">
            ${movie.details}
        </div>

    </div>

</div>

`).join("");

}

window.selectMovie = function (title) {

console.log("Seleccionada:", title);

const movie = movies.find(m => m.title === title);

    if (!movie) return;

    // ==========================
    // Datos de la película
    // ==========================


    // ==========================
// Datos de la película

document.getElementById("previewPoster").src =
    movie.poster;

document.getElementById("previewTitle").innerText =
    movie.title;

document.getElementById("previewDetails").innerText =
    movie.details;

    // ==========================
    // Link automático
    // ==========================

    let action = movie.link || "";

    if (!action.startsWith("/")) {
        action = "/" + action;
    }

    document.getElementById("previewAction").value =
        action;

    document.getElementById("previewImage").value =
        movie.poster;

   // ==========================
// Campos ocultos (Supabase)
// ==========================

document.getElementById("title").value =
    " Ya disponible: " + movie.title;

document.getElementById("image").value =
    movie.poster;

document.getElementById("action").value =
    action;


// ==========================
// Campo editable
// ==========================

document.getElementById("pushTitle").value =
    " Ya disponible: " + movie.title;


// Mostrar película seleccionada

document.getElementById("preview").style.display = "block";


// Ocultar resultados

searchResults.style.display = "none";


// Dejar solo la película elegida

search.value = movie.title;


}

      let sending = false;

  window.send = async function () {

    if (sending) return;

    const title = document.getElementById("pushTitle").value.trim();
    const body = document.getElementById("body").value.trim();
    const image = document.getElementById("image").value.trim();
    const action = document.getElementById("action").value.trim();
    const status = document.getElementById("status");

    if (!title || !body) {
      status.innerText = "⚠️ Completa título y mensaje";
      return;
    }

    sending = true;
    status.innerText = "⏳ Enviando...";

    try {
      const { error } = await supabase
        .from("notifications")
        .insert([
          { title, body, image, action }
        ]);

      if (error) {
        console.log(error);
        status.innerText = "❌ Error al guardar en Supabase";
        sending = false;
        return;
      }

      const { error: fnError } =
        await supabase.functions.invoke("quick-responder");

      if (fnError) {
        console.log(fnError);
        status.innerText = "⚠️ Guardado pero error enviando push";
        sending = false;
        return;
      }

      status.innerText = "✔ Notificación enviada 📱";

      document.getElementById("title").value = "";
      document.getElementById("body").value = "";
      document.getElementById("image").value = "";
      document.getElementById("action").value = "";

    } catch (e) {
      console.log(e);
      status.innerText = "❌ Error inesperado";
    }

    sending = false;
  }
</script>
