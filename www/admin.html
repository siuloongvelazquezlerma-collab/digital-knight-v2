<!DOCTYPE html>
<html>
<head>
  <title>Digital Knight Admin</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      background-color: #01011d;
      font-family: 'Roboto', sans-serif;
      color: white;
      min-height: 100%;
      overflow-x: hidden;
      overscroll-behavior-y: contain;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #7c5cff;
      font-size: 22px;
    }

    .card {
      background: rgba(26, 26, 37, 0.95);
      padding: 25px;
      border-radius: 18px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      outline: none;
      background: #1c1c28;
      color: white;
      font-size: 14px;
    }

    textarea {
      height: 100px;
      resize: none;
    }

    button {
      width: 100%;
      background: #7c5cff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background: #9a7bff;
      transform: scale(1.02);
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      opacity: 0.8;
      text-align: center;
    }

    .section-title {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>📺 Digital Knight Admin Panel</h2>

    <div class="section-title">Contenido principal</div>
    <input id="title" placeholder="Título (ej: Nuevo episodio)">
    <textarea id="body" placeholder="Mensaje"></textarea>

    <div class="section-title">Imagen (poster / portada)</div>
    <input id="image" placeholder="URL de imagen (ej: poster.jpg o link)">

    <div class="section-title">Acción al tocar notificación</div>
    <input id="action" placeholder="Ej: /movie/123 o /episode/5">

    <button onclick="send()">Enviar Notificación</button>

    <div class="status" id="status"></div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://wplyrhcszuoordgaphax.supabase.co",
      "TU_ANON_KEY"
    );

    window.send = async function () {

      const title = document.getElementById("title").value;
      const body = document.getElementById("body").value;
      const image = document.getElementById("image").value;
      const action = document.getElementById("action").value;
      const status = document.getElementById("status");

      if (!title || !body) {
        status.innerText = "⚠️ Completa título y mensaje";
        return;
      }

      status.innerText = "⏳ Enviando...";

      const { error } = await supabase
        .from("notifications")
        .insert([
          {
            title,
            body,
            image,
            action
          }
        ]);

      if (error) {
        console.log(error);
        status.innerText = "❌ Error al guardar";
        return;
      }

      const { error: fnError } = await supabase.functions.invoke("quick-responder");

      if (fnError) {
        console.log(fnError);
        status.innerText = "⚠️ Guardado pero error enviando push";
        return;
      }

      status.innerText = "✔ Notificación enviada 📱";

      document.getElementById("title").value = "";
      document.getElementById("body").value = "";
      document.getElementById("image").value = "";
      document.getElementById("action").value = "";
    }
  </script>

</body>
</html>
