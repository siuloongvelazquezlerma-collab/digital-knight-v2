<!DOCTYPE html>
<html>
<head>
  <title>Digital Knight Admin</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Roboto', sans-serif;
      overflow-x: hidden;
      background: #000;
      color: white;
    }

    /* 🎬 FONDO CINEMÁTICO */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      position: relative;
      background: url("https://copilot.microsoft.com/th/id/BCO.1819160d-a9d8-4c56-8397-6f6316199800.png") no-repeat center center/cover;
    }

    /* 🌑 OVERLAY */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.95),
        rgba(0,0,0,0.7),
        rgba(0,0,0,0.4)
      );
      z-index: 0;
    }

    /* 🧊 CARD GLASS */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      padding: 28px;
      border-radius: 18px;

      background: rgba(20, 20, 35, 0.65);
      backdrop-filter: blur(18px);

      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      border: 1px solid rgba(124, 92, 255, 0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #b7a6ff;
      font-size: 22px;
      letter-spacing: 1px;
    }

    .section-title {
      margin-top: 12px;
      font-size: 11px;
      opacity: 0.7;
      letter-spacing: 1px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      outline: none;
      background: rgba(10,10,20,0.8);
      color: white;
      font-size: 14px;
    }

    textarea {
      height: 100px;
      resize: none;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;

      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: white;
      font-weight: bold;

      transition: 0.2s ease;
    }

    button:hover {
      transform: scale(1.03);
      filter: brightness(1.1);
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      opacity: 0.8;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>📺 Digital Knight Admin Panel</h2>

    <div class="section-title">Contenido principal</div>
    <input id="title" placeholder="Título (ej: Nuevo episodio)">
    <textarea id="body" placeholder="Mensaje"></textarea>

    <div class="section-title">Imagen (poster / portada)</div>
    <input id="image" placeholder="URL de imagen">

    <div class="section-title">Acción al tocar notificación</div>
    <input id="action" placeholder="/movie/123 o /episode/5">

    <button onclick="send()">Enviar Notificación</button>

    <div class="status" id="status"></div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://wplyrhcszuoordgaphax.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndwbHlyaGNzenVvb3JkZ2FwaGF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYyNDg5NzAsImV4cCI6MjA4MTgyNDk3MH0.VctFmTaBMHkhbqDhezAvFoAT_QcC-bk7A3gH1MoMScU"
    );

    window.send = async function () {

      const title = document.getElementById("title").value;
      const body = document.getElementById("body").value;
      const image = document.getElementById("image").value;
      const action = document.getElementById("action").value;
      const status = document.getElementById("status");

      if (!title || !body) {
        status.innerText = "⚠️ Completa título y mensaje";
        return;
      }

      status.innerText = "⏳ Enviando...";

      const { error } = await supabase
        .from("notifications")
        .insert([{ title, body, image, action }]);

      if (error) {
        console.log(error);
        status.innerText = "❌ Error al guardar";
        return;
      }

      const { error: fnError } = await supabase.functions.invoke("quick-responder");

      if (fnError) {
        console.log(fnError);
        status.innerText = "⚠️ Guardado pero error enviando push";
        return;
      }

      status.innerText = "✔ Notificación enviada 📱";

      document.getElementById("title").value = "";
      document.getElementById("body").value = "";
      document.getElementById("image").value = "";
      document.getElementById("action").value = "";
    }
  </script>

</body>
</html>
